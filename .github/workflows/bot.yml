name: Tradium Tender Bot v8.3

on:
  schedule:
    # يشتغل كل 30 دقيقة
    - cron: '*/30 * * * *'
  workflow_dispatch: # يسمح بالتشغيل اليدوي

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml urllib3
      
      - name: Run Tender Bot v8.3
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py
      
      - name: Save sent file (Anti-Duplicate)
        run: |
          git config --global user.name 'Tradium Bot'
          git config --global user.email 'bot@tradium.dz'
          git add sent_v7.json sent_ids_backup.txt || echo "no sent file yet"
          git commit -m "update sent file - $(date)" || echo "no changes to commit"
          git push || echo "push failed, trying again"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
