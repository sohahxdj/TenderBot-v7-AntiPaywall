name: Tradium Tender Bot v8.4
permissions:
  contents: write
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml urllib3
      - name: Run Tender Bot v8.4
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
      - name: Save sent file
        run: |
          git config --global user.name 'Tradium Bot'
          git config --global user.email 'bot@tradium.dz'
          git pull --rebase origin main || echo "pull failed"
          git add sent_v7.json sent_ids_backup.txt || echo "no file"
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "update sent file - $(date -u)"
          git push origin main
