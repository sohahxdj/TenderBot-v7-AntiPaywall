name: Tradium v21 FINAL - MDN + TRENDS
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install requests beautifulsoup4 lxml urllib3 cloudscraper
      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRENDS_COOKIE: ${{ secrets.TRENDS_COOKIE }}
        run: python bot.py
      - name: Save
        run: |
          git config --global user.name "Tradium Bot"
          git config --global user.email "bot@tradium.dz"
          if [! -f sent_v7.json ]; then echo '{"ids":[],"count":0}' > sent_v7.json; fi
          git add sent_v7.json public/tenders.json -f || true
          git diff --staged --quiet || git commit -m "🔒 v21 - $(date)"
          git push || echo "push done"
