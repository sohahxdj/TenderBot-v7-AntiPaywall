name: Tradium FINAL 2h30 Fixed
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests beautifulsoup4 lxml urllib3
      - env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
      - name: Save sent file
        run: |
          git config --global user.name "Tradium Bot"
          git config --global user.email "bot@tradium.dz"
          if [! -f sent_v7.json ]; then echo '{"ids":[],"count":0}' > sent_v7.json; fi
          git add sent_v7.json -f
          git diff --staged --quiet || git commit -m "final fix $(date +'%d/%m/%Y %H:%M')"
          git push || echo "ok"
