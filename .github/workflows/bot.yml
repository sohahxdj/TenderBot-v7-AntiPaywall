name: Tradium Bot v15.2 FINAL
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests beautifulsoup4 lxml urllib3
      - env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
      - run: |
          git config --global user.name "Tradium Bot"
          git config --global user.email "bot@tradium.dz"
          git add sent_v7.json sent_ids_backup.txt -f
          git diff --staged --quiet || git commit -m "🔒 حفظ"
          git push
