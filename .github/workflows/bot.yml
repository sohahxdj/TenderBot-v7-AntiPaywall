name: Tradium Tender Bot v89

on:
  schedule:
    - cron: '*/30 * * * *'  # كل 30 دقيقة
  workflow_dispatch:  # تشغيل يدوي

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml urllib3
          
      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py
          
      - name: Save sent history (anti-duplicate)
        run: |
          git config --global user.name "Tradium Bot"
          git config --global user.email "bot@tradium.dz"
          # إنشاء الملفات إذا غير موجودة
          touch sent_v7.json sent_ids_backup.txt
          git add sent_v7.json sent_ids_backup.txt -f
          git diff --staged --quiet || git commit -m "🔒 حفظ المناقصات المرسلة - ضد التكرار ${{ github.run_number }}"
          git push || echo "لا يوجد تغييرات للحفظ"
